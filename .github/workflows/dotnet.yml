name: Build and run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  Environment: Test
  Browser: Chrome
  BrowserHeadless: true

jobs:
  build:

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Print variables
      run: echo "Environment is '$Environment' and browser is '$Browser'"
    - name: Unit Test
      run: dotnet test --filter FullyQualifiedName~UnitTests --no-build --verbosity normal
    - name: E2E Test
      run: dotnet test --filter FullyQualifiedName~Positive --no-build --verbosity normal
